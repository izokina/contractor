name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag against the version
        run: test "$GITHUB_REF_NAME" = "v$(go run ./cmd/contractor -version | cut -d ' ' -f 2)"
      - run: go vet ./cmd/... ./pkg/...
      - run: ./scripts/run-tests.sh
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              ext=
              if [ "$os" = windows ]; then ext=.exe; fi
              GOOS=$os GOARCH=$arch go build -trimpath -o "dist/contractor-$os-$arch$ext" ./cmd/contractor
            done
          done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
